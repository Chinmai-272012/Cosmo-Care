</head><body>
<section id="intro"><canvas id="sky"></canvas>
<div class="c"><h1>COSMO CARE</h1><p>Health and wellbeing for life beyond Earth</p>
<button class="bt" onclick="enter('home')">Enter Cosmo Care</button><button class="bt" onclick="enter('hub')">Education</button></div>
<div id="cap"></div></section>
<button id="mute">SOUND OFF</button>
<div id="app" hidden><header><span class="logo">COSMO CARE <span class="tag">AI MISSION SYSTEM</span></span><span id="hi" class="mut"></span><span class="sp"></span>
<button class="b g" onclick="go('hub')">Education</button><button class="b em" onclick="scan()">Emergency Scan</button></header>
<div class="wrap"><nav id="nav"></nav><main id="m"></main></div><div id="ov"></div></div>
<script>
const $=s=>document.querySelector(s);
const esc=t=>String(t==null?"":t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let S={profile:null,checkups:[],readings:[],foods:[],workouts:[],bm:[],chat:[],xp:0,done:{},theme:"dark",ac:"#8B83FF"};
try{Object.assign(S,JSON.parse(localStorage.getItem("cosmocare")||"{}"))}catch(e){}
const save=()=>{try{localStorage.setItem("cosmocare",JSON.stringify(S))}catch(e){console.warn("Cosmo Care could not save locally:",e)}};
const today=()=>new Date().toISOString().slice(0,10);
function award(k,xp){const key=k+today();if(S.done[key])return;S.done[key]=1;S.xp+=xp;save()}
const pages={home:"Home",checkup:"Checkup",log:"Health Log",nova:"Nova",hub:"Education",settings:"Settings"};
let cur="home";
function go(p){cur=p;$("#nav").innerHTML=Object.entries(pages).map(([k,v])=>`<button class="${k==cur?"on":""}" onclick="go('${k}')">${v}</button>`).join("");$("#m").innerHTML="";R[p]();applyTheme()}
function applyTheme(){document.documentElement.dataset.theme=S.theme;document.documentElement.style.setProperty("--ac",S.ac);$("#hi").textContent=S.profile?"Hi, "+S.profile.name:""}
const lvl=()=>Math.floor(S.xp/100)+1;
const streak=()=>{const act=k=>S.checkups.some(c=>c.date==k)||S.foods.some(c=>c.date==k)||S.workouts.some(c=>c.date==k)||S.readings.some(c=>c.date==k);let n=0,d=new Date();if(!act(d.toISOString().slice(0,10)))d.setDate(d.getDate()-1);while(act(d.toISOString().slice(0,10))){n++;d.setDate(d.getDate()-1)}return n};
const R={};
R.home=()=>{const t=today(),f=S.foods.filter(x=>x.date==t),kc=f.reduce((a,x)=>a+ +x.kcal,0),ca=f.reduce((a,x)=>a+ +x.ca,0);
const tr=[["Wellbeing checkup",S.checkups.some(c=>c.date==t)],["Food logged",f.length>0],["Workout recorded",S.workouts.some(w=>w.date==t)],["Health readings",S.readings.some(r=>r.date==t)]];
$("#m").innerHTML=`<div class="card"><h2>Welcome, ${esc(S.profile.name)}</h2><p class="mut">Small healthy habits keep a mission going. One step at a time.</p>
<span class="tag">Level ${lvl()}</span><span class="tag">${S.xp} XP</span><span class="tag">Streak ${streak()} d</span>
<div class="bar" style="margin:10px 0"><i style="width:${S.xp%100}%"></i></div><button class="b" onclick="go('checkup')">Daily check-in</button></div>
<div class="grid">${tr.map(x=>`<div class="card"><b>${x[0]}</b><p class="${x[1]?"good":"warn"}">${x[1]?"&#10003; Complete":"Not yet today"}</p></div>`).join("")}</div>
<div class="card"><h3>Today’s nutrition</h3><p class="mut">General reference targets, not a prescription.</p>
Calories ${kc} / 2500 kcal<div class="bar"><i style="width:${Math.min(100,kc/25)}%"></i></div><br>Calcium ${ca} / 1000 mg<div class="bar"><i style="width:${Math.min(100,ca/10)}%"></i></div></div>`};
const Q=[["Physical feeling (1-10)","pf"],["Pain or discomfort (0-10)","pain"],["Headache (0-10)","head"],["Dizziness (0-10)","diz"],["Fatigue (0-10)","fat"],["Mental mood (1-10)","mood"],["Stress (0-10)","str"],["Anxiety (0-10)","anx"],["Motivation (1-10)","mot"],["Sleep quality (1-10)","sq"]];
R.checkup=()=>{$("#m").innerHTML=`<div class="card"><h2>Daily checkup</h2><form onsubmit="return false">${Q.map(q=>`<label>${q[0]}: <b id="v_${q[1]}">5</b></label><input type="range" min="0" max="10" value="5" id="q_${q[1]}" oninput="$('#v_${q[1]}').textContent=this.value">`).join("")}
<label>Hours slept</label><input type="number" id="q_hrs" min="0" max="24" step="0.5" value="7"><label>Enough water today?</label><select id="q_water"><option>Yes</option><option>No</option></select>
<label>Notes (optional)</label><textarea id="q_note"></textarea><button class="b" onclick="subCheck()">Save checkup</button></form></div><div id="cres"></div>`};
function subCheck(){const c={id:crypto.randomUUID(),date:today(),ts:Date.now()};Q.forEach(q=>c[q[1]]=+$("#q_"+q[1]).value);c.hrs=+$("#q_hrs").value;c.water=$("#q_water").value;c.note=$("#q_note").value;
if(c.hrs<0||c.hrs>24)return alert("Hours slept must be 0-24");
const prev=S.checkups.filter(x=>x.date!=c.date).slice(-1)[0];S.checkups=S.checkups.filter(x=>x.date!=c.date);S.checkups.push(c);award("chk",20);save();
const flags=[];if(c.pain>=7||c.head>=7||c.diz>=7)flags.push("High pain, headache or dizziness scores. Consider talking to your flight surgeon or medical team.");if(c.hrs<6)flags.push("Short sleep. Prioritise rest where your schedule allows.");if(c.str>=8||c.anx>=8)flags.push("High stress or anxiety. Consider contacting your support or psychological team.");if(c.water=="No")flags.push("Drink water when you can.");
if(prev&&c.mood<prev.mood-2)flags.push("Mood dropped noticeably since last checkup.");
$("#cres").innerHTML=`<div class="card"><h3>Summary (+20 XP)</h3><p>Sleep ${c.hrs} h, mood ${c.mood}/10, stress ${c.str}/10, fatigue ${c.fat}/10.</p>${flags.length?flags.map(f=>`<p class="warn">&bull; ${esc(f)}</p>`).join(""):'<p class="good">Nothing stands out today.</p>'}<p class="mut">This is general wellness feedback, not a diagnosis. For urgent symptoms use Emergency Scan.</p></div>`}
const REF={hr:[50,100,"Heart rate BPM"],sys:[90,130,"Systolic mmHg"],dia:[60,85,"Diastolic mmHg"],spo2:[94,100,"SpO2 %"],temp:[36,37.5,"Temp °C"],rad:[0,500,"Radiation µSv"],co2:[0,1000,"Cabin CO₂ ppm"],kpa:[97,103,"Cabin pressure kPa"]};
// Equipment and collection guidance shown below the manual vitals form.
const VITAL_GUIDES=[
{title:"Heart rate",fields:"Heart rate (BPM)",equipment:"Finger pulse oximeter or a validated heart-rate monitor",steps:["Sit quietly and rest for about 5 minutes before measuring.","If using a fingertip pulse oximeter, place it on a warm, relaxed finger as directed by the manufacturer.","Keep your hand still and wait until the pulse/heart-rate number settles.","Record the heart rate in beats per minute (BPM). If using a wearable, follow its instructions and note that readings can vary by device."]},
{title:"Blood pressure",fields:"Systolic and diastolic (mmHg)",equipment:"Automatic upper-arm blood-pressure monitor with the correct cuff size",steps:["Avoid exercise, caffeine, and smoking for 30 minutes beforehand where applicable; empty your bladder and rest quietly for 5 minutes.","Sit with your back supported, feet flat and legs uncrossed. Put the cuff on a bare upper arm, not over clothing.","Support the arm at heart level and follow the monitor’s instructions. Do not talk or move during the reading.","Record both numbers: systolic (top) and diastolic (bottom). If repeating, wait at least 1 minute and record both readings."]},
{title:"Blood oxygen (SpO₂)",fields:"SpO₂ (%)",equipment:"Fingertip pulse oximeter",steps:["Make sure the hand is warm and relaxed. Remove nail polish or artificial nails if they interfere with the sensor.","Place the device on a finger as shown in its instructions.","Rest your hand, keep still, and wait for the display to stabilise.","Record the SpO₂ percentage and the pulse rate if shown. Consumer devices can be inaccurate; consider symptoms and professional advice, not the number alone."]},
{title:"Body temperature",fields:"Temperature (°C)",equipment:"Digital thermometer (oral, ear, or forehead type)",steps:["Use a digital thermometer suitable for the measurement site and follow its manufacturer instructions.","For an oral reading, wait 15 minutes after eating or drinking; place the tip under the tongue and close your mouth until it signals completion.","For ear or forehead models, position the sensor exactly as instructed. Do not compare readings from different sites as if they were identical.","Record the value in °C and note the measurement site (oral, ear, or forehead). Clean the device as directed."]},
{title:"Radiation exposure",fields:"Radiation (µSv)",equipment:"Approved personal dosimeter or mission radiation-monitoring system",steps:["This is an environmental/mission exposure measurement, not a routine body vital sign.","Use only the dosimeter assigned and configured under the mission’s radiation-monitoring procedure.","Wear or position it where the mission protocol specifies; do not change its settings or placement independently.","Enter the value and units exactly as displayed, and refer interpretation or alerts to the mission radiation-safety team."]},
{title:"Cabin carbon dioxide (CO₂)",fields:"Cabin CO₂ (ppm)",equipment:"Calibrated cabin CO₂ monitor or spacecraft environmental sensor",steps:["This measures cabin air, not the person’s blood CO₂.","Use the installed or approved calibrated sensor and follow the environmental-control system procedure.","Read the displayed concentration in parts per million (ppm); note the sensor location and time if the mission procedure asks for them.","Treat alarms or unexpected readings according to the spacecraft’s environmental and emergency procedures. Do not attempt equipment adjustments unless authorised and trained."]},
{title:"Cabin pressure",fields:"Cabin pressure (kPa)",equipment:"Installed cabin pressure gauge or calibrated pressure sensor",steps:["This is a cabin-environment measurement, not a personal vital sign.","Read the approved cabin gauge or monitoring display; do not use a household blood-pressure device.","Record the value in kilopascals (kPa) and note the time or sensor location if required.","If the system reports an alarm or an unexpected change, follow mission procedures and notify the responsible crew/ground team."]}

al:[["Severe allergic reaction","Reaksi alahan teruk"],1,["Call mission control / flight surgeon and get a crewmate now.","Take the epinephrine auto-injector out of its protective tube. Form a fist around it with your thumb nearest the safety cap and pull the cap off.","Never put fingers over the needle end and never inject through clothing.","Jab the needle end firmly and straight against the outer thigh until you hear or feel a click. Hold it there for 10 seconds.","Put the used injector back in its tube and secure it. It may be repeated after about 20 minutes if symptoms return or get worse, as directed by the medical team.","Keep watching their breathing and be ready for CPR."],["Hubungi kawalan misi / pakar bedah penerbangan dan dapatkan rakan krew sekarang.","Keluarkan auto-suntik epinefrin dari tiub pelindung. Genggam dengan ibu jari paling dekat dengan penutup keselamatan dan tarik penutup.","Jangan letak jari di hujung jarum dan jangan suntik melalui pakaian.","Tekan hujung jarum dengan kuat dan lurus pada paha luar sehingga terdengar atau terasa klik. Tahan 10 saat.","Masukkan semula alat yang digunakan ke dalam tiubnya dan ikat. Boleh diulang selepas kira-kira 20 minit jika simptom kembali atau bertambah teruk, atas arahan pasukan perubatan.","Terus pantau pernafasan dan bersedia untuk CPR."],["Epinephrine auto-injector from the emergency pack only.","Hanya auto-suntik epinefrin daripada pek kecemasan."]],
loc:[["Unresponsive / cardiac arrest (CPR and AED)","Tidak sedar / sawan jantung (CPR dan AED)"],1,["Check the area is safe, then check the person: shout and tap the shoulders.","Unresponsive but breathing normally: restrain them securely (Crew Medical Restraint System in space), get a second person and call mission control or the emergency number.","Not breathing normally, or only gasping: call for help, get the AED and start CPR: 30 chest compressions then 2 breaths (1 second each), about 2 minutes.","Put the AED electrodes on the bare chest, switch it on and follow its spoken prompts. Do not touch the person while it analyses.","After each AED prompt to start CPR, do 30 compressions and 2 breaths again, and check for a pulse for 10 seconds.","If a pulse or normal breathing returns, stop compressions and help their breathing. Do not stop CPR until help takes over, they recover, or your flight surgeon tells you to."],["Pastikan kawasan selamat, kemudian periksa orang itu: jerit dan tepuk bahu.","Tidak sedar tetapi bernafas normal: ikat mereka dengan selamat (Sistem Penahan Perubatan Krew di angkasa), dapatkan orang kedua dan hubungi kawalan misi atau nombor kecemasan.","Tidak bernafas normal atau hanya tercungap: minta bantuan, ambil AED dan mulakan CPR: 30 tekanan dada kemudian 2 hembusan (1 saat setiap satu), kira-kira 2 minit.","Letak elektrod AED pada dada terdedah, hidupkan dan ikut arahan suaranya. Jangan sentuh orang itu semasa ia menganalisis.","Selepas setiap arahan AED untuk mulakan CPR, buat 30 tekanan dan 2 hembusan semula, dan semak nadi 10 saat.","Jika nadi atau pernafasan normal kembali, hentikan tekanan dan bantu pernafasan. Jangan hentikan CPR sehingga bantuan mengambil alih, mereka pulih, atau pakar bedah penerbangan memberitahu."],["No medicine. Advanced life support drugs are for trained medical officers only.","Tiada ubat. Ubat sokongan hayat lanjutan hanya untuk pegawai perubatan terlatih."]],
ck:[["Choking","Tercekik"],1,["Ask if they are choking. If they are awake, stand behind them.","Make a fist and place it above the belly button but below the rib cage. Pull sharply inward and upward. Repeat until the object clears or they become unconscious.","If they become unconscious: lower them, open the airway (head tilt, chin lift), look in the mouth and remove the object only if it is easy to reach.","Pinch the nose and try to give breaths. If breaths do not go in or there is no response, start CPR and use the AED.","Once clear: check pulse, breathing rate and blood pressure, write them down and contact the flight surgeon."],["Tanya jika mereka tercekik. Jika sedar, berdiri di belakang mereka.","Buat penumbuk dan letak di atas pusat tetapi di bawah tulang rusuk. Tarik kuat ke dalam dan ke atas. Ulang sehingga benda keluar atau mereka tidak sedar.","Jika tidak sedar: baringkan, buka saluran udara (dongak kepala, angkat dagu), lihat dalam mulut dan keluarkan benda hanya jika mudah dicapai.","Picit hidung dan cuba beri hembusan. Jika hembusan tidak masuk atau tiada respons, mulakan CPR dan guna AED.","Setelah keluar: semak nadi, kadar pernafasan dan tekanan darah, catat dan hubungi pakar bedah penerbangan."],["No medicine. (The NASA manual uses abdominal thrusts; some first-aid courses add back blows first.)","Tiada ubat. (Manual NASA guna tekanan perut; sesetengah kursus pertolongan cemas tambah tepukan belakang dahulu.)"]],
po:[["Toxic exposure","Pendedahan toksik"],1,["Protect yourself first: use breathing, eye and skin protection before moving the person out of the exposure, so fewer people are exposed.","Skin: quickly remove soiled clothes, brush off visible particles, wipe off liquids with a towel, then rinse the area with water.","Eyes: remove and discard contact lenses, flush with water straight away and keep rinsing until the pain stops or the flight surgeon says to stop.","If they breathed it in and breathing is difficult, follow the breathing steps.","Call the flight surgeon. Note which chemical, medicine or new exposure was involved and photograph affected body parts."],["Lindungi diri dahulu: guna perlindungan pernafasan, mata dan kulit sebelum mengalihkan orang itu dari pendedahan, supaya kurang orang terdedah.","Kulit: tanggalkan pakaian kotor dengan cepat, sapu zarah yang kelihatan, lap cecair dengan tuala, kemudian bilas kawasan dengan air.","Mata: tanggalkan dan buang kanta lekap, bilas dengan air segera dan teruskan sehingga sakit hilang atau pakar bedah penerbangan arahkan berhenti.","Jika disedut dan sukar bernafas, ikut langkah pernafasan.","Hubungi pakar bedah penerbangan. Catat bahan kimia, ubat atau pendedahan baharu dan ambil gambar bahagian badan terjejas."],["No antidote or medicine unless a medical professional directs.","Tiada penawar atau ubat kecuali diarah profesional perubatan."]],
sz:[["Seizure","Sawan"],1,["Protect from injury: move them to the centre of the area, away from hard structures.","Never pry the mouth open or put anything in it. Seizures usually last under a minute; time it.","Over 5 minutes, or seizures that repeat, is an emergency: call the flight surgeon or emergency number at once. A medical officer may give anti-seizure medicine from the kit as directed.","After it stops they will be confused for several minutes. Stay with them, give oxygen if trained, and check SpO2 if you have an oximeter.","Check head, arms, legs, teeth and tongue for injuries and photograph them. Record what happened and any medicines taken.","Give food, drink or tablets only when they are awake, coherent and able to swallow, and only as the surgeon directs."],["Lindungi dari kecederaan: alihkan ke tengah kawasan, jauh dari struktur keras.","Jangan paksa buka mulut atau letak apa-apa di dalamnya. Sawan biasanya kurang seminit; catat masa.","Lebih 5 minit, atau sawan berulang, ialah kecemasan: hubungi pakar bedah penerbangan atau nombor kecemasan serta-merta. Pegawai perubatan boleh beri ubat anti-sawan daripada kit atas arahan.","Selepas berhenti mereka akan keliru beberapa minit. Temani, beri oksigen jika terlatih, dan semak SpO2 jika ada oksimeter.","Periksa kepala, lengan, kaki, gigi dan lidah untuk kecederaan dan ambil gambar. Catat apa berlaku dan ubat yang diambil.","Beri makanan, minuman atau pil hanya apabila mereka sedar, koheren dan boleh menelan, dan hanya atas arahan pakar bedah."],["Anti-seizure medicine only as directed by the surgeon.","Ubat anti-sawan hanya atas arahan pakar bedah."]],
br:[["Breathing difficulty","Sukar bernafas"],1,["Count pulse and breaths for 15 seconds each and multiply by 4. Write them down.","Danger signs: blue or gray lips, face or hands; breathing slower than 12 or faster than 30 a minute; snoring or struggling to breathe in. Call for help now and give oxygen by mask if trained.","If they have a prescribed inhaler (or albuterol in the kit, as directed): shake it, they breathe out fully, place it in the mouth, breathe in slowly as it is pressed, then hold the breath for 8 to 10 seconds.","Check SpO2 with an oximeter and write it down.","Look at the mouth, nose, neck and chest for swelling, extra secretions and effort of breathing; if trained, listen to both sides of the chest.","Note what led up to it: medicines, fever, cough, how severe. Call the flight surgeon."],["Kira nadi dan nafas selama 15 saat setiap satu dan darab 4. Catat.","Tanda bahaya: bibir, muka atau tangan biru atau kelabu; pernafasan lebih perlahan daripada 12 atau lebih laju daripada 30 seminit; berdengkur atau bersusah payah menarik nafas. Minta bantuan sekarang dan beri oksigen melalui topeng jika terlatih.","Jika ada inhaler preskripsi (atau albuterol dalam kit, atas arahan): goncang, mereka hembus nafas sepenuhnya, letak dalam mulut, tarik nafas perlahan semasa ditekan, kemudian tahan nafas 8 hingga 10 saat.","Semak SpO2 dengan oksimeter dan catat.","Lihat mulut, hidung, leher dan dada untuk bengkak, rembesan berlebihan dan usaha bernafas; jika terlatih, dengar kedua-dua belah dada.","Catat apa yang mendahului: ubat, demam, batuk, tahap teruk. Hubungi pakar bedah penerbangan."],["Only their own prescribed inhaler or kit medicine as directed.","Hanya inhaler preskripsi sendiri atau ubat kit atas arahan."]],
dt:[["Dental emergency","Kecemasan pergigian"],0,["Lost tooth or bleeding socket: press clean gauze firmly on the socket and keep steady pressure until the bleeding stops.","Keep any tooth or fragment in a clean bag. Photograph the tooth and mouth and send the photos to your flight surgeon or dentist.","Pain: use pain relief from your medical kit as directed by the surgeon. Avoid chewing on the affected side.","Lost filling: remove debris (brush teeth), roll temporary filling material into a ball, press it into the cavity and bite down for 2 minutes. It sets in about 5 minutes; no drinking for about 1 hour; avoid hard food on that side for 12 to 24 hours.","Broken tooth with exposed pulp: keep food out of the cavity and get the surgeon's direction. A clove-oil (eugenol) dressing must never be swallowed and should touch skin and gums as little as possible."],["Gigi tercabut atau soket berdarah: tekan kasa bersih dengan kuat pada soket dan kekalkan tekanan sehingga darah berhenti.","Simpan gigi atau serpihan dalam beg bersih. Ambil gambar gigi dan mulut dan hantar kepada pakar bedah penerbangan atau doktor gigi.","Sakit: guna ubat tahan sakit daripada kit perubatan atas arahan pakar bedah. Elak mengunyah di sebelah terjejas.","Tampalan tercabut: buang serpihan (memberus gigi), gulung bahan tampalan sementara menjadi bola, tekan ke dalam rongga dan gigit 2 minit. Ia mengeras kira-kira 5 minit; jangan minum kira-kira 1 jam; elak makanan keras di sebelah itu 12 hingga 24 jam.","Gigi patah dengan pulpa terdedah: jauhkan makanan dari rongga dan dapatkan arahan pakar bedah. Pembalut minyak bunga cengkih (eugenol) tidak boleh ditelan dan sentuh kulit dan gusi sesedikit mungkin."],["Pain relief only as directed; never swallow a dental dressing.","Ubat tahan sakit hanya atas arahan; jangan telan pembalut pergigian."]]});
KW.push(["dt",/tooth|teeth|dental|gum|gigi/]);

<script id="cosmo-claude-advanced">
/* Cosmo Care AI: secure, same-origin Claude backend integration. */
const COSMO_SYSTEM = `You are Nova, the AI health-information assistant inside Cosmo Care, an educational spaceflight health app. Be calm, clear and concise. You are not a clinician and must not diagnose, prescribe, calculate medication doses, or replace mission medical protocols. Never invent measurements or claim that a sensor is connected. Treat supplied readings as manually entered and potentially inaccurate. Explain uncertainty and ask for missing context when necessary. If a user describes potentially life-threatening symptoms or a critical spacecraft environmental alarm, tell them to contact the mission medical team or local emergency services immediately and follow approved mission procedures; do not delay for this app. For routine readings, explain what the values mean in general terms, identify possible reasons to recheck, and recommend clinician review for concerning or persistent results. Do not use a single reading to declare someone safe or unsafe. Do not provide operational instructions for changing spacecraft life-support systems. Distinguish personal vital signs from cabin/environment readings. Never claim NASA or another agency endorses this app.`;
async function cosmoClaude(messages, context, lang){
  let response;
  try {
    response=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages,context:context||'',lang:lang||'en'}),signal:AbortSignal.timeout(27000)});
  } catch(err) {
    if(err && err.name==='TimeoutError') throw new Error('Claude took too long to respond. Please try again.');
    throw new Error('Could not reach the Cosmo Care AI server. Check your connection and deployment.');
  }
  const data=await response.json().catch(()=>({}));
  if(!response.ok)throw new Error(data.error||'Claude service is not available.');
  if(typeof data.text!=='string'||!data.text.trim())throw new Error('Claude returned an empty response.');
  return data.text;
}
function cosmoUrgent(text){return /chest pain|severe trouble breathing|not breathing|unconscious|passed out|severe bleeding|seizure|overdose|suicid|sakit dada|tidak bernafas|pengsan/i.test(text||'')}
/* Prefer the user's own configured Claude API via the secure backend; local answers remain available offline. */
ask=async function(){
  const input=$('#ci');if(!input)return;const t=input.value.trim();if(!t)return;
  S.chat.push({r:'u',t},{r:'n',t:'Connecting to Claude…',src:'AI'});S.chat=S.chat.slice(-40);save();if(cur==='nova')R.nova();
  let answer=null,source='Offline assistant';
  if(cosmoUrgent(t)){answer=nova(t);source='Safety guidance';}
  else if((S.set||{}).share!=='Do not share with Nova'){
    try{
      const recent=S.chat.slice(0,-1).slice(-12).map(m=>({role:m.r==='u'?'user':'assistant',content:String(m.t).slice(0,4000)}));
      while(recent.length&&recent[0].role!=='user')recent.shift();
      answer=await cosmoClaude(recent,ctx(),LANG);source='Claude AI';
    }catch(err){answer=nova(t)+'\n\nClaude connection unavailable: '+err.message+' You can continue using the offline assistant.';}
  }else{answer='AI data sharing is turned off in Settings. Your question was answered locally.\n\n'+nova(t);}
  S.chat[S.chat.length-1]={r:'n',t:answer,src:source};S.chat=S.chat.slice(-40);save();if(cur==='nova')R.nova();
};
/* Add a Claude-powered reading review to the existing Vitals page. */
const _cosmoOriginalLog=R.log;
R.log=function(){_cosmoOriginalLog();if(tab==='v'){
  const panel=`<section class="card" id="cosmo-ai-vitals"><div class="ai-kicker">COSMO AI / CLINICAL CONTEXT</div><h3>Claude Vitals Review</h3><p class="mut">Ask Claude to explain your latest manually entered readings and recent trend. Only the readings shown below are sent; your name and profile photo are not included.</p><div class="row" style="align-items:center"><button class="b" onclick="cosmoAnalyseVitals()">Analyse latest readings</button><span id="cosmo-ai-status" class="ai-status">Waiting for readings</span></div><div id="cosmo-ai-result" aria-live="polite"></div><p class="mut">Educational support only. Not a diagnosis, medical clearance or replacement for a clinician or mission protocol. For urgent symptoms, contact emergency/mission medical support immediately.</p></section>`;
  $('#m').insertAdjacentHTML('afterbegin',panel);
  const status=$('#cosmo-ai-status');if(status)status.textContent=S.readings.length?'Claude review available':'Waiting for readings';
}};
async function cosmoAnalyseVitals(){
  const out=$('#cosmo-ai-result'),status=$('#cosmo-ai-status');
  if(!S.readings||!S.readings.length){out.innerHTML='<p class="warn">Record at least one reading before requesting an AI review.</p>';return;}
  if((S.set||{}).share==='Do not share with Nova'){out.innerHTML='<p class="warn">AI data sharing is disabled in Settings. Enable sharing to send readings to Claude, or use Nova for offline general information.</p>';return;}
  status.textContent='Preparing selected readings…';status.classList.remove('online');out.textContent='Claude is reviewing the selected readings…';
  try{
    const recent=S.readings.slice(-6).map(r=>{
      const stamp=Number(r.ts);
      const clean={};
      if(Number.isFinite(stamp)&&stamp>0) clean.recordedAt=new Date(stamp).toISOString();
      else if(typeof r.date==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(r.date)) clean.recordedAt=r.date;
      for(const k of Object.keys(REF)){if(r[k]!==''&&r[k]!==null&&r[k]!==undefined&&Number.isFinite(Number(r[k])))clean[k]=Number(r[k]);}
      return clean;
    });
    const prompt='Please explain these manually entered readings in plain language. Identify missing units or context, note if values are outside the app’s general reference ranges without treating those ranges as a diagnosis, suggest checking measurement technique and seeking qualified medical review where appropriate. Do not declare the person safe, diagnose, prescribe, or give medication doses. Distinguish personal vitals from environmental readings.\n\nReadings (latest first): '+JSON.stringify(recent.slice().reverse());
    const answer=await cosmoClaude([{role:'user',content:prompt}],'No name or profile details supplied. These are manually entered readings from an educational app.',LANG);
    out.innerHTML='';const p=document.createElement('div');p.className='ai-output';p.textContent=answer;out.appendChild(p);status.textContent='Claude AI connected';status.classList.add('online');
  }catch(err){out.textContent='Claude could not review these readings: '+err.message+' Check your backend deployment and API key.';status.textContent='AI unavailable';}
}
/* Mark the assistant connection state without implying an API key is already configured. */
const _cosmoNova=R.nova;
R.nova=function(){_cosmoNova();const top='<div class="card"><div class="ai-kicker">MISSION INTELLIGENCE</div><h3>Nova · Claude AI</h3><p class="mut">Connect your Anthropic API key through the server environment to enable live Claude responses. Until then, the app uses its built-in offline assistant.</p><span class="ai-status">Connection checked when you send a message</span></div>';$('#m').insertAdjacentHTML('afterbegin',top);};
</script>
